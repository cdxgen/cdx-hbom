name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  test-os-matrix:
    name: Test OS Matrix (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 24.x
          - os: macos-latest
            node-version: 24.x
          - os: windows-latest
            node-version: 24.x
          - os: windows-11-arm
            node-version: 24.x

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      # test/cdx20.test.js validates the 2.0 output against the schema files
      # cdxgen bundles, with the ajv versions cdxgen uses. Only those files are
      # checked out, from the cdxgen/cdxgen#4763 commit that adds the pinned
      # CycloneDX 2.0 draft schema.
      - name: Checkout CycloneDX 2.0 schema from cdxgen
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          repository: cdxgen/cdxgen
          ref: d8c052a496d3c325a35d669f32d5a8628a365400
          path: cdxgen-schema
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /data/cyclonedx-2.0-bundled.schema.json
            /data/cyclonedx-2.0-cryptography-defs.schema.json
            /data/behavior-taxonomy.schema.json
            /data/jsf-0.82.schema.json
            /data/spdx.schema.json

      - name: Install the schema validator
        run: npm install --prefix cdxgen-schema --no-save --no-package-lock --no-audit --no-fund --ignore-scripts ajv@8.20.0 ajv-formats@3.0.1

      - name: Run full test suite
        env:
          CDX_HBOM_CDXGEN_ROOT: ${{ github.workspace }}/cdxgen-schema
        run: npm test

  publish:
    name: Publish To npm
    runs-on: ubuntu-latest
    needs:
      - test-os-matrix
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Publish with provenance
        run: npm publish --provenance --access public

      # JSR is best effort: npm is the primary registry, and a JSR outage
      # (v0.6.0: connection reset while polling publish status) must not
      # fail a release that already reached npm.
      - name: Publish to JSR
        if: ${{ hashFiles('jsr.json') != '' }}
        continue-on-error: true
        timeout-minutes: 10
        run: npx -y jsr publish
